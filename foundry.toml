[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
# Base hardfork with the B20 precompiles (L0, LAUNCH.md §8.4). B20 itself only runs on a fork of
# Base Sepolia or Base: locally `createB20` reverts with FeatureNotActivated.
hardfork = "base:Cobalt"
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[fmt]
line_length = 120

# See https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
